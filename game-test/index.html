const GW=32,GH=36;
function make(build,blink){
  const gr=[...Array(GH)].map(()=>Array(GW).fill('.'));
  const px=(x,y,c)=>{if(x>=0&&x<GW&&y>=0&&y<GH)gr[y][x]=c};
  const rect=(x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)px(x+i,y+j,c)};
  const eye=(x,y,w,h)=>{if(blink)rect(x,y+h-1,w,1,'E');else rect(x,y,w,h,'E')};
  build({px,rect,eye});
  return paint(gr);
}
function paint(gr){ // 色のとなりの空白を黒い輪郭にして、キャンバスに描く
  const h=gr.length,w=gr[0].length,c=document.createElement('canvas');c.width=w;c.height=h;const x2=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){let v=gr[y][x];
    if(v==='.'){if([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{const q=(gr[y+dy]||[])[x+dx];return q&&q!=='.'}))v='K';else continue}
    x2.fillStyle=PAL[v];x2.fillRect(x,y,1,1)}
  return c;
}

let sfxGain=null,noiseBuf=null;const sfxLast={};

function sfx(name){
  if(NET.role==='host'&&B&&B.sfxq&&name!=='select'&&name!=='err'&&B.sfxq.length<24)B.sfxq.push(name); // 相手のスマホでも鳴らす
  if(!actx||!soundOn||actx.state!=='running')return;
  const now=actx.currentTime;if(SFX_GAP[name]&&sfxLast[name]&&now-sfxLast[name]<SFX_GAP[name])return;sfxLast[name]=now;
  if(!sfxGain){sfxGain=actx.createGain();sfxGain.gain.value=.22;sfxGain.connect(actx.destination);
    noiseBuf=actx.createBuffer(1,actx.sampleRate*.5,actx.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
  const tone=(type,f0,f1,t0,dur,vol=.5)=>{const o=actx.createOscillator(),gn=actx.createGain();o.type=type;
    o.frequency.setValueAtTime(f0,now+t0);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,now+t0+dur);
    gn.gain.setValueAtTime(vol,now+t0);gn.gain.exponentialRampToValueAtTime(.001,now+t0+dur);o.connect(gn);gn.connect(sfxGain);o.start(now+t0);o.stop(now+t0+dur+.02)};
  const noise=(dur,vol,ftype,f0,f1)=>{const s=actx.createBufferSource(),fl=actx.createBiquadFilter(),gn=actx.createGain();s.buffer=noiseBuf;
    fl.type=ftype;fl.frequency.setValueAtTime(f0,now);fl.frequency.exponentialRampToValueAtTime(f1,now+dur);
    gn.gain.setValueAtTime(vol,now);gn.gain.exponentialRampToValueAtTime(.001,now+dur);s.connect(fl);fl.connect(gn);gn.connect(sfxGain);s.start(now);s.stop(now+dur+.02)};
  const notes=(type,fs,step,vol=.4)=>fs.forEach((f,i)=>tone(type,f,f,i*step,step*1.6,vol));
  switch(name){
    case 'select':tone('triangle',700,700,0,.05,.5);break;
    case 'err':tone('square',160,120,0,.14,.3);break;
    case 'deploy':tone('square',330,880,0,.12,.28);noise(.12,.25,'lowpass',2000,300);break;
    case 'shot':tone('square',900,500,0,.05,.12);break;
    case 'hit':noise(.06,.35,'highpass',3000,1200);break;
    case 'boom':noise(.45,.8,'lowpass',1800,80);tone('sine',140,40,0,.4,.7);break;
    case 'tower':noise(.7,.9,'lowpass',2200,60);tone('sine',180,35,0,.6,.8);tone('square',440,110,.05,.5,.18);break;
    case 'gacha':notes('square',[523,659,784,1047],.07,.3);break;
    case 'heal':notes('triangle',[784,988,1175],.06,.45);break;
    case 'win':notes('square',[523,659,784,1047,784,1047],.11,.3);break;
    case 'lose':notes('triangle',[523,440,349,262],.18,.5);break;
    case 'draw':notes('triangle',[523,523],.16,.45);break;
  }
}

function steer(u,tx,ty){ // 地上のキャラは橋をわたる

function update(dt){

// ===== オンライン対戦(合言葉で2台をつなぐ。部屋を作った人のスマホが試合を動かし、相手に画面を送る) =====
const PEER_URL='https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';
const NET={on:false,role:null,peer:null,conn:null,stage:'menu',code:'',input:'',msg:'',acc:0,to:0,
  send(m){try{if(this.conn&&this.conn.open)this.conn.send(m)}catch(e){}}};
const MY=856;   // 上下を入れかえる基準。相手の画面でも「自分の陣地が下」になるようにする
let UID=0;
const R=v=>Math.round(v),R2=v=>Math.round(v*100)/100;
function loadPeer(cb){if(window.Peer)return cb();const s=document.createElement('script');s.src=PEER_URL;s.onload=cb;
  s.onerror=()=>netErr('通信の道具を読み込めなかった…電波を確かめてね');document.head.appendChild(s)}
function netErr(m){if(/browser-incompatible/.test(m))m='この画面の中では、スマホ同士をつなげない…ゲームの公開ページ（tooosu.github.io）で遊んでね';netClose();NET.stage='error';NET.msg=m;screen='lobby'}
function netClose(){const c=NET.conn,p=NET.peer;NET.conn=null;NET.peer=null;NET.on=false;NET.role=null;clearTimeout(NET.to);
  try{c&&c.close()}catch(e){}try{p&&p.destroy()}catch(e){}}
function netHost(){netClose();NET.stage='hosting';NET.code='';
  loadPeer(()=>{if(NET.stage!=='hosting')return;const code=String(Math.floor(1000+Math.random()*9000));
    const peer=new Peer('tooosu-kanpan-'+code);NET.peer=peer;
    peer.on('open',()=>{if(NET.peer===peer)NET.code=code});
    peer.on('error',e=>{if(NET.peer!==peer)return;if(e.type==='unavailable-id'){netHost();return}netErr('つながらなかった…（'+e.type+'）')});
    peer.on('connection',c=>{if(NET.peer!==peer)return;
      if(NET.conn){c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),400)});return}
      NET.conn=c;netBind(c,'host');c.on('open',()=>{NET.on=true;NET.role='host';netStart()})})})}
function netJoin(code){netClose();NET.stage='connecting';
  loadPeer(()=>{if(NET.stage!=='connecting')return;const peer=new Peer();NET.peer=peer;
    NET.to=setTimeout(()=>{if(NET.peer===peer&&!NET.on)netErr('時間切れ…合言葉と電波を確かめてね')},15000);
    peer.on('open',()=>{if(NET.peer!==peer)return;const c=peer.connect('tooosu-kanpan-'+code,{serialization:'json',reliable:true});
      NET.conn=c;netBind(c,'guest');c.on('open',()=>{NET.on=true;NET.role='guest';clearTimeout(NET.to)})});
    peer.on('error',e=>{if(NET.peer!==peer)return;netErr(e.type==='peer-unavailable'?'その合言葉の部屋が見つからない…':'つながらなかった…（'+e.type+'）')})})}
function netBind(c,role){
  c.on('data',m=>{if(NET.conn!==c||!m||!m.t)return;
    if(m.t==='full'){netErr('その部屋は、もう対戦中みたい');return}
    if(role==='host'){
      if(m.t==='play'&&B&&B.online&&screen==='battle'&&!B.over&&B.ready<=0){const d=DEF[m.k];
        if(!d||!POOL.includes(m.k)||B.ecoin<d.cost)return;
        B.ecoin-=d.cost;deploy(m.k,'e',clamp(m.x,40,500),d.spell?clamp(MY-m.y,70,ZONE1):clamp(MY-m.y,70,RIV0-12))}}
    else{if(m.t==='start')guestStart();else if(m.t==='s')guestSnap(m)}});
  c.on('close',()=>{if(NET.conn!==c)return;const was=NET.on;netClose();
    if(was){toast={s:'相手との通信が切れた…',t:2.5};screen='title'}else netErr('つながらなかった…')});
  c.on('error',()=>{});
}
function netStart(){start();B.online=true;B.sfxq=[];NET.send({t:'start'})}
function guestStart(){start();B.online=true;for(const t of B.towers){t.side=t.side==='p'?'e':'p';t.y=MY-t.y}}
function snapshot(){const fl=s=>s==='p'?'e':'p';
  return{t:'s',
    u:B.units.map(u=>({id:u.id,k:u.k,side:fl(u.side),x:R(u.x),y:R(MY-u.y),hp:R(u.hp),max:u.max,face:u.face,dep:R2(Math.max(0,u.dep)),
      sleep:u.sleep>0?1:0,stumble:u.stumble>0?1:0,listen:u.listen>0?1:0,ally:u.ally?1:0,flash:u.flash>0?.1:0,
      bub:u.bub?{s:u.bub.s,t:1}:null,drinks:u.drinks,cr:u.cr?R(u.cr):0})),
    tw:B.towers.map(t=>[R(t.hp),t.dead?1:0,t.flash>0?1:0]),
    sh:B.shots.map(s=>({x:R(s.x),y:R(MY-s.y),kind:s.kind,vx:R(s.vx||0),vy:-R(s.vy||0)})),
    bo:B.bombs.map(b=>({x:R(b.x),y:R(MY-b.y),t:R2(b.t)})),
    fx:B.fx.slice(-60).map(f=>f.k==='p'?{k:'p',x:R(f.x),y:R(MY-f.y),vx:R(f.vx),vy:-R(f.vy),t:R2(f.t),col:f.col}
      :f.k==='ring'?{k:'ring',x:R(f.x),y:R(MY-f.y),t:R2(f.t),r:f.r}:{k:'line',x1:R(f.x1),y1:R(MY-f.y1),x2:R(f.x2),y2:R(MY-f.y2),t:R2(f.t)}),
    po:B.pops.map(f=>({x:R(f.x),y:R(MY-f.y),s:f.alt||f.s,col:f.acol||f.col,size:f.size,t:R2(f.t)})),
    g:{t:R2(B.t),ready:R2(B.ready),over:B.over,endT:R2(B.endT),result:B.result==='win'?'lose':B.result==='lose'?'win':B.result,pf:B.ef,ef:B.pf,coin:R2(B.ecoin),shake:R2(B.shake)},
    sfx:B.sfxq.splice(0)}}
function guestSnap(m){if(!B||!B.online||screen!=='battle')return;
  const old=new Map(B.units.map(u=>[u.id,u]));
  B.units=m.u.map(a=>{const o=old.get(a.id),ox=o?o.x:a.x,oy=o?o.y:a.y,u=Object.assign(o||{t:rand(0,6)},a);u.tx=a.x;u.ty=a.y;u.x=ox;u.y=oy;return u});
  m.tw.forEach((a,i)=>{const t=B.towers[i];if(!t)return;t.hp=a[0];t.dead=!!a[1];t.flash=a[2]?.1:0});
  B.shots=m.sh;B.bombs=m.bo;B.fx=m.fx;B.pops=m.po;
  const wasOver=B.over;Object.assign(B,m.g);if(B.over)B.sel=null;
  for(const n of m.sfx)sfx(n==='win'?'lose':n==='lose'?'win':n);
  if(B.over&&!wasOver)B.endT=Math.max(B.endT,.5)}
function guestUpdate(dt){
  for(const f of B.pops){f.t-=dt;f.y-=36*dt}B.pops=B.pops.filter(f=>f.t>0);
  for(const f of B.fx){f.t-=dt;if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt}}B.fx=B.fx.filter(f=>f.t>0);
  B.shake=Math.max(0,B.shake-dt);
  const k=Math.min(1,dt*14);for(const u of B.units){u.t+=dt;u.x+=(u.tx-u.x)*k;u.y+=(u.ty-u.y)*k}
  for(const s of B.shots){s.x+=s.vx*dt;s.y+=s.vy*dt}
  for(const b of B.bombs)b.t-=dt;
  if(B.over){B.endT-=dt;if(B.endT<=0)screen='over'}}
function netTick(dt){if(NET.role!=='host'||!NET.on||!B||!B.online||screen!=='battle')return;
  NET.acc+=dt;if(NET.acc<.05)return;NET.acc=0;NET.send(snapshot())}
function drawLobby(){bgNight();soundBtn();
  txt('ともだちと対戦',W/2,110,32,'#f4ecd8');
  const st=NET.stage,dots='.'.repeat(1+Math.floor(T*3)%3);
  if(st==='menu'){
    ['2人とも、このページを開いてね','1人が「部屋を作る」→ 4つの数字が出る','もう1人が「合言葉で入る」→ その数字を入れる'].forEach((l,i)=>txt(l,W/2,180+i*34,17,'#c9bda5','center',false));
    txt('デッキは、それぞれ自分のデッキで戦うよ',W/2,300,15,'#8a93a8','center',false);
    button('部屋を作る',110,350,320,74,netHost,'#c8141b',28);
    button('合言葉で入る',110,450,320,74,()=>{NET.input='';NET.stage='joining'},'#1f6b5a',28);
    button('もどる',170,600,200,56,()=>{netClose();screen='title'},'#2a3350',20)}
  else if(st==='hosting'){
    txt('合言葉',W/2,200,22,'#d9b25a');
    if(NET.code){box(120,226,300,130,'#120f1c');txt(NET.code.split('').join(' '),W/2,316,72,'#f4ecd8')}
    else txt('じゅんび中'+dots,W/2,300,26,'#c9bda5');
    txt('この数字を相手に伝えてね',W/2,410,18,'#c9bda5','center',false);
    txt('相手が入ると、すぐ始まるよ',W/2,442,18,'#c9bda5','center',false);
    button('やめる',170,600,200,56,()=>{netClose();NET.stage='menu'},'#2a3350',20)}
  else if(st==='joining'){
    txt('合言葉（4つの数字）を入れてね',W/2,166,19,'#c9bda5','center',false);
    for(let i=0;i<4;i++){box(110+i*82,190,70,86,'#120f1c',i<NET.input.length?'#f2c94c':'#4a3e2a');if(NET.input[i])txt(NET.input[i],145+i*82,252,44,'#f4ecd8')}
    ['1','2','3','4','5','6','7','8','9','けす','0','入る'].forEach((kk,i)=>{const x=95+(i%3)*120,y=300+Math.floor(i/3)*92,go=kk==='入る',del=kk==='けす';
      button(kk,x,y,110,80,()=>{if(del)NET.input=NET.input.slice(0,-1);
        else if(go){if(NET.input.length===4)netJoin(NET.input);else toast={s:'4つの数字を入れてね',t:1.4}}
        else if(NET.input.length<4)NET.input+=kk},go?'#c8141b':del?'#3a2a3a':'#2a3350',go||del?22:32)});
    button('もどる',170,690,200,56,()=>{NET.stage='menu'},'#2a3350',20)}
  else if(st==='connecting'){
    txt('つないでいます'+dots,W/2,320,26,'#f4ecd8');
    txt('つながると、すぐ始まるよ',W/2,370,17,'#c9bda5','center',false);
    button('やめる',170,600,200,56,()=>{netClose();NET.stage='menu'},'#2a3350',20)}
  else{
    wrap(NET.msg||'うまくいかなかった…',440,20).forEach((l,i)=>txt(l,W/2,300+i*32,20,'#ff8a8a','center',false));
    button('もどる',170,600,200,56,()=>{NET.stage='menu'},'#2a3350',20)}
}
function draw(){btns=[];g.clearRect(0,0,W,H);
  if(screen==='title')drawTitle();else if(screen==='deck')drawDeckEdit();else if(screen==='battle')drawBattle();else if(screen==='over')drawOver();else if(screen==='lobby')drawLobby();
  if(review&&screen==='over'){btns=[];drawReview()}
  if(toast){g.font='18px "DotGothic16"';const w=g.measureText(toast.s).width+30;g.fillStyle='#000';g.fillRect(W/2-w/2,780,w,40);txt(toast.s,W/2,807,18,'#f4ecd8','center',false)}
}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);netTick(dt);draw();music();requestAnimationFrame(loop)}
document.fonts.load('20px "DotGothic16"').finally(()=>requestAnimationFrame(loop));
</script>
